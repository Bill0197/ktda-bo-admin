# BO Admin — nginx site config for the UAT EC2 boxes.
#
# Takes over the place tokenization-web had on these boxes: nginx serves the
# built SPA (dist/) and reverse-proxies the backends on the SAME ORIGIN, so
# there is no CORS to configure and the engine's session cookie
# (JSESSIONID, SameSite=Lax) is sent with every call.
#
# The app calls two prefixes — the same ones the Cloudflare Pages build uses
# (functions/tok, functions/omni), so the build needs no environment:
#   /tok/*                 -> the accounting engine's /api/*      (127.0.0.1:8086)
#   /omni/api/operator/*   -> omnichannel's staff endpoints       (127.0.0.1:8087)
#
# NOTE: SELinux is Enforcing on these hosts. nginx may only open sockets to
# the backends once `httpd_can_network_connect` is on — provision.sh sets it.

upstream bo_admin_engine {
    server 127.0.0.1:8086;
    keepalive 16;
}

upstream bo_admin_omnichannel {
    server 127.0.0.1:8087;
    keepalive 8;
}

# The engine answers every unauthenticated request with a NEW anonymous
# session cookie. A 401 that lands just after a sign-in (an in-flight
# /auth/me, say) would overwrite the real session and sign the user straight
# back out. So the engine's Set-Cookie is passed on for anything but a 401.
# (The engine sets one cookie, JSESSIONID; $upstream_http_set_cookie carries
# only the first Set-Cookie header, which is all there is.)
map $upstream_status $bo_admin_session_cookie {
    401     "";
    default $upstream_http_set_cookie;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/bo-admin;
    index index.html;

    # The institution this back office works for (an engine institution id).
    # Omnichannel scopes every operator call to the institution in
    # X-Dev-Institution; every /omni location below sets it from this value,
    # which also replaces any the browser sent. Left empty, no header goes and
    # omnichannel answers for its own default institution. Set it at deploy.
    set $bo_admin_institution "";

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints asset filenames, so they can be cached hard...
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ...and index.html must never be, or a deploy is invisible until the
    # browser's cache expires.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The engine: /tok/<path> -> /api/<path> (the trailing slashes on both sides
    # of proxy_pass swap the prefix).
    location /tok/ {
        proxy_pass http://bo_admin_engine/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;

        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $bo_admin_session_cookie always;
        add_header Cache-Control "no-store" always;
    }

    # Compliance's identity checks (the registry mismatches, the photo queue
    # and one photo) and the Customer desk (find a customer; their standing,
    # money timeline, messages, app activity and reinstate/close proposals,
    # and the queue of those proposals) and the Transactions page
    # (every customer's M-Pesa payments, and their totals), the re-screening
    # hits and a customer's support requests (the closure requests), the
    # payment issues queue, and the market settings with their change log —
    # reads only, same session gate as below. X-Dev-Subject
    # (who is acting, for omnichannel's audit on UAT) passes through from the
    # app; nginx cannot read the session's email to set it itself.
    location ~ ^/omni/api/operator/(onboarding/(applications|applications/screening-hits|documents|documents/[0-9a-fA-F-]+/content)|support/tickets|customers|customers/interventions|customers/[0-9a-fA-F-]+(/(timeline|messages|activity|interventions))?|transactions|transactions/summary|payments/issues|market/settings|fx/settings|fx/conversions|institutions|institution/settings)$ {
        limit_except GET { deny all; }
        auth_request /_bo_admin_session;

        rewrite ^/omni(/.*)$ $1 break;
        proxy_pass http://bo_admin_omnichannel;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_set_header Origin     "";
        proxy_set_header Cookie     "";
        proxy_set_header X-Dev-Institution $bo_admin_institution;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # The market-settings change log (GET) and a new proposal (POST) share one
    # path, so neither the reads-only location above nor the POSTs-only one
    # below fits it. An exact match wins over both.
    location = /omni/api/operator/market/settings/changes {
        limit_except GET POST { deny all; }
        auth_request /_bo_admin_session;

        rewrite ^/omni(/.*)$ $1 break;
        proxy_pass http://bo_admin_omnichannel;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_set_header Origin     "";
        proxy_set_header Cookie     "";
        proxy_set_header X-Dev-Institution $bo_admin_institution;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # The FX change log (GET) and a new rate proposal (POST) share one path, as the
    # market settings' do; an exact match wins over the reads-only and POSTs-only locations.
    location = /omni/api/operator/fx/settings/changes {
        limit_except GET POST { deny all; }
        auth_request /_bo_admin_session;

        rewrite ^/omni(/.*)$ $1 break;
        proxy_pass http://bo_admin_omnichannel;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_set_header Origin     "";
        proxy_set_header Cookie     "";
        proxy_set_header X-Dev-Institution $bo_admin_institution;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Reports and Surveillance, which omnichannel serves from the reporting
    # service: the CSV reports, the alert queue and one alert, and the run log
    # (reads), and an alert assigned or closed and a snapshot or rule run by
    # hand (POSTs). A report over a long period can take a while, and
    # omnichannel waits up to 90s for the service, so these wait longer than
    # the other operator calls.
    location ~ ^/omni/api/operator/reporting/(reports/(transactions|holdings|token-supply|suspicious-activity)\.csv|alerts|alerts/[0-9a-fA-F-]+|runs)$ {
        limit_except GET { deny all; }
        auth_request /_bo_admin_session;

        rewrite ^/omni(/.*)$ $1 break;
        proxy_pass http://bo_admin_omnichannel;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_set_header Origin     "";
        proxy_set_header Cookie     "";
        proxy_set_header X-Dev-Institution $bo_admin_institution;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/omni/api/operator/reporting/(alerts/[0-9a-fA-F-]+/(assign|close)|runs/(snapshot|surveillance))$ {
        limit_except POST { deny all; }
        auth_request /_bo_admin_session;

        rewrite ^/omni(/.*)$ $1 break;
        proxy_pass http://bo_admin_omnichannel;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_set_header Origin     "";
        proxy_set_header Cookie     "";
        proxy_set_header X-Dev-Institution $bo_admin_institution;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # Bulk onboarding and payment runs (reads): the recent runs, whether
    # onboarding has completed for an institution, one run (polled about once
    # a second while it runs) and its reconciliation.
    location ~ ^/omni/api/operator/bulk-loads(/onboarding-status|/[0-9a-fA-F-]+(/reconciliation)?)?$ {
        limit_except GET { deny all; }
        auth_request /_bo_admin_session;

        rewrite ^/omni(/.*)$ $1 break;
        proxy_pass http://bo_admin_omnichannel;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_set_header Origin     "";
        proxy_set_header Cookie     "";
        proxy_set_header X-Dev-Institution $bo_admin_institution;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # A bulk CSV upload. A full farmer file (700,000 rows) is tens of
    # megabytes, far over nginx's 1 MB default, so this location raises the
    # limit and waits longer while omnichannel stores the file. Process
    # (/bulk-loads/{id}/process) is an ordinary POST and goes through the
    # POSTs-only location below.
    location = /omni/api/operator/bulk-loads/upload {
        limit_except POST { deny all; }
        auth_request /_bo_admin_session;
        client_max_body_size 64m;
        client_body_timeout 120s;

        rewrite ^/omni(/.*)$ $1 break;
        proxy_pass http://bo_admin_omnichannel;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_set_header Origin     "";
        proxy_set_header Cookie     "";
        proxy_set_header X-Dev-Institution $bo_admin_institution;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # Omnichannel's staff actions — POSTs only (link codes, messages, KYC
    # status, a photo decision, a payment issue handled, a market-settings
    # proposal or decision). On UAT omnichannel checks no token, so this
    # location is the gate: nothing is forwarded unless the caller holds a
    # live BO Admin (engine) session.
    location /omni/api/operator/ {
        limit_except POST { deny all; }
        auth_request /_bo_admin_session;

        proxy_pass http://bo_admin_omnichannel/api/operator/;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        # Omnichannel's CORS list is localhost only and it 403s any other
        # Origin; this call is same-origin, so drop it.
        proxy_set_header Origin     "";
        proxy_set_header Cookie     "";
        proxy_set_header X-Dev-Institution $bo_admin_institution;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # auth_request target: 2xx lets the omnichannel call through, 401 stops it.
    location = /_bo_admin_session {
        internal;
        proxy_pass http://bo_admin_engine/api/auth/me;
        proxy_http_version 1.1;
        # A sub-request inherits the caller's method (POST here). /auth/me is a
        # GET endpoint; don't rely on the engine also answering it for POST.
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_set_header Cookie     $http_cookie;
    }

    # Nothing else under /omni is reachable.
    location /omni/ {
        return 404;
    }

    # SPA fallback: every other path returns index.html so client-side routing
    # (react-router) owns it. Mirrors public/_redirects.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
