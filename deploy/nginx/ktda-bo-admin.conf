# KTDA Back Office — nginx site for the UAT EC2 box (RHEL, SELinux Enforcing).
#
# Served under /admin/ on port 8185, reached only by the shared ALB
# (ktda-apps-lb), which terminates TLS and routes /admin* here — the same shape
# as the KTDA stub apps (/backoffice, /farmer, ... on 8181-8184). The SPA is
# built with Vite base=/admin/ so its asset URLs carry the prefix the ALB
# routes on (deploy/README.md).
#
# On the box the backends answer plaintext on localhost, so there is no CORS
# and none of the self-signed-certificate trouble a Cloudflare Pages build hits:
#   /admin/tok/*   -> the accounting engine's /api/*   (127.0.0.1:8086)
#   /admin/omni/*  -> omnichannel's staff endpoints      (127.0.0.1:8087)
#
# NOTE: nginx may only open sockets to the backends once SELinux's
# httpd_can_network_connect is on — provision-ktda-bo-admin.sh sets it.

# The engine opens a fresh anonymous session (and Set-Cookie) on every
# unauthenticated request. A 401 that lands just after a sign-in (an in-flight
# /auth/me, say) would overwrite the real session and sign the user straight
# back out, so its Set-Cookie is passed on for anything but a 401.
map $upstream_status $ktda_bo_session_cookie {
    401     "";
    default $upstream_http_set_cookie;
}

server {
    listen 8185;
    listen [::]:8185;
    server_name _;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ALB health check (the target group's path is "/") and anything outside the
    # app's own prefix.
    location = / { add_header Content-Type text/plain; return 200 "ok\n"; }

    # Bare prefix -> prefix/ so the SPA's relative asset URLs resolve.
    location = /admin { return 301 /admin/; }

    # The engine: /admin/tok/<path> -> /api/<path> (127.0.0.1:8086). Carries the
    # sign-in and session; the browser holds the engine's JSESSIONID cookie.
    location /admin/tok/ {
        rewrite ^/admin/tok(/.*)$ /api$1 break;
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;

        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $ktda_bo_session_cookie always;
        add_header Cache-Control "no-store" always;
    }

    # Omnichannel's staff (operator) endpoints: /admin/omni/<path> -> <path>
    # (127.0.0.1:8087). On UAT omnichannel runs its dev profile, which scopes
    # every operator call to the institution in X-Dev-Institution and names the
    # actor in X-Dev-Subject (both required, or it falls back to its default
    # institution). Both are set HERE, overriding anything the browser sent, so
    # a client can neither choose the institution nor impersonate an actor.
    #
    # On EC2 the Cloudflare functions/omni proxy does not run, so this location
    # replaces it. A straight proxy with no session gate is acceptable for UAT
    # dev. SECURITY: that leaves the operator surface open to anyone who reaches
    # this URL; the production answer is the secured omnichannel profile with
    # real staff tokens, not a static subject.
    location /admin/omni/ {
        rewrite ^/admin/omni(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        # Same-origin: drop Origin (omnichannel's CORS allowlist is localhost only).
        proxy_set_header Origin     "";
        # The scope and actor are this server's to set, never the browser's.
        proxy_set_header X-Dev-Institution 2d878f14-0d76-4aa0-b9d7-ffe4ace1562e;
        proxy_set_header X-Dev-Subject     ktda-operator;
        client_max_body_size 64m;   # bulk onboarding/payment CSV uploads
        proxy_read_timeout 300s;    # bulk process + long reports
        add_header Cache-Control "no-store" always;
    }

    # The SPA (Vite base=/admin/): alias maps /admin/* to the webroot, with a
    # client-side-routing fallback to its index.html.
    location /admin/ {
        alias /var/www/ktda-bo-admin/;
        try_files $uri $uri/ /admin/index.html;
    }
}
